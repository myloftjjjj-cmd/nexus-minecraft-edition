name: Build Nexus MC Edition APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Configure Android Platform safely
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform to Capacitor..."
            npx cap add android
          else
            echo "Android platform already exists, skipping cap add."
          fi

      - name: Generate Android icons and splash
        run: |
          npm install --no-save @capacitor/assets
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png
            cp icon.png assets/splash.png
            npx @capacitor/assets generate --android || true
          fi

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-MC-Edition-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
